<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emprendedores</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=Manrope:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body data-titulo="Emprendedores">

<a class="saltar" href="#contenido">Saltar al contenido</a>
<div id="cabecera"></div>

<main id="contenido" class="bloque">
  <div class="envoltura">
    <div class="encabezado-bloque">
      <h1 style="font-size:clamp(1.7rem,3vw,2.4rem)">Emprendedores</h1>
      <p id="resumen" class="resumen-filtros"></p>
    </div>
    <div class="tabla-envoltura">
      <table class="tabla">
        <thead><tr>
          <th>Emprendimiento</th><th>Clasificación</th><th>Comuna</th>
          <th>Ficha</th><th class="num">Postulaciones</th><th></th>
        </tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
    <div id="detalle-abierto"></div>
  </div>
</main>

<script src="config/marca.js"></script>
<script src="config/territorio.js"></script>
<script src="config/catalogo.js"></script>
<script src="config/estados.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modelo.js"></script>
<script src="assets/js/nucleo.js"></script>
<script src="assets/js/arranque.js"></script>
<script src="assets/js/clusters.js"></script>
<script src="assets/js/admin.js"></script>
<script>
EU.arranque.admin(function () { EU.admin.montar(); });
EU.alEstarListo(function () {
  'use strict';
  var esc = EU.util.esc;
  var lista = EU.datos.emprendedores.slice().sort(function (a, b) {
    return a.emprendimiento.nombre.localeCompare(b.emprendimiento.nombre, 'es');
  });

  document.getElementById('resumen').textContent = lista.length + ' fichas registradas';

  /* SOLICITAR CORRECCIÓN DESDE ACÁ (pedido del cliente el 2-nov).
     Hasta entonces solo se podía pedir corrección en Validaciones, o sea
     a fichas que esperaban revisión. Si a una ficha ya validada se le
     pasaba algo, no había cómo devolvérsela al emprendedor. Usa lo mismo
     que Validaciones, así que le llega el mismo correo automático. */
  function formularioCorreccion(fi) {
    var yaEnCorreccion = fi.estado === 'correccion';
    return '<form class="formulario" data-corregir="' + esc(fi.id) + '" ' +
        'style="margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--borde)">' +
      '<h3 style="font-size:1rem;margin:0 0 .5rem">Solicitar corrección</h3>' +
      (yaEnCorreccion
        ? '<p class="pista">Esta ficha ya está en corrección. Puedes cambiar la observación: ' +
          'el emprendedor la ve al entrar, pero no le llega otro correo.</p>'
        : '<p class="pista">La ficha vuelve a "Requiere corrección" y le llega un correo con lo ' +
          'que escribas. Mientras no la corrija, no puede postular.</p>') +
      '<div class="campo"><label>Qué parte de la ficha<select name="seccion">' +
        EU.admin.SECCIONES.map(function (s) {
          return '<option value="' + s[0] + '">' + esc(s[1]) + '</option>';
        }).join('') +
      '</select></label></div>' +
      '<div class="campo"><label>Qué tiene que arreglar' +
        '<span class="pista">Escríbelo como se lo dirías a él: es lo que lee.</span>' +
        '<textarea name="observacion" rows="3" maxlength="500" required></textarea></label></div>' +
      '<p><button type="submit" class="boton boton--linea">' +
        (yaEnCorreccion ? 'Actualizar la observación' : 'Solicitar corrección') + '</button></p>' +
      '<p class="mensaje-form" role="status" aria-live="polite"></p>' +
    '</form>';
  }

  function pintar() {
    document.getElementById('filas').innerHTML = lista.map(function (fi) {
      var posts = EU.datos.postulacionesDe(fi.id);
      return '<tr>' +
        '<td><strong>' + esc(fi.emprendimiento.nombre) + '</strong>' +
          '<small>' + esc(fi.representante.nombre) + '</small></td>' +
        '<td>' + esc(EU.admin.clasificacionCorta(fi)) + '</td>' +
        '<td>' + esc(EU.territorio.nombreComuna(fi.emprendimiento.comuna)) + '</td>' +
        '<td>' + esc(EU.estados.etiqueta('ficha', fi.estado)) + '</td>' +
        '<td class="num">' + posts.length + '</td>' +
        '<td><button type="button" class="enlace-boton" data-ver="' + esc(fi.id) + '">Ver ficha</button></td>' +
      '</tr>' +
      '<tr class="fila-detalle" data-detalle="' + esc(fi.id) + '" hidden><td colspan="6">' +
        EU.admin.fichaCompleta(fi) + formularioCorreccion(fi) + '</td></tr>';
    }).join('');
  }
  pintar();

  document.getElementById('filas').addEventListener('click', function (e) {
    if (!e.target.hasAttribute('data-ver')) return;
    var id = e.target.getAttribute('data-ver');
    var fila = document.querySelector('[data-detalle="' + id + '"]');
    fila.hidden = !fila.hidden;
    e.target.textContent = fila.hidden ? 'Ver ficha' : 'Cerrar ficha';
  });

  document.getElementById('filas').addEventListener('submit', function (e) {
    var form = e.target.closest('[data-corregir]');
    if (!form) return;
    e.preventDefault();
    var id = form.getAttribute('data-corregir');
    var texto = form.elements.observacion.value.trim();
    var msg = form.querySelector('.mensaje-form');
    if (!texto) {
      msg.className = 'mensaje-form mensaje-form--error';
      msg.textContent = 'Escribe qué tiene que arreglar.';
      return;
    }
    msg.className = 'mensaje-form';
    msg.textContent = 'Guardando…';
    EU.admin.resolverFicha(id, 'corregir', texto, form.elements.seccion.value)
      .then(function () {
        pintar();
        var fila = document.querySelector('[data-detalle="' + id + '"]');
        if (fila) {
          fila.hidden = false;
          var nuevo = fila.querySelector('.mensaje-form');
          if (nuevo) nuevo.textContent = 'Listo: la ficha quedó en corrección.';
        }
        var boton = document.querySelector('[data-ver="' + id + '"]');
        if (boton) boton.textContent = 'Cerrar ficha';
      })
      .catch(function (err) {
        msg.className = 'mensaje-form mensaje-form--error';
        msg.textContent = (err && err.message) || 'No se pudo guardar.';
      });
  });

  EU.admin.conectarDocumentos(document);
});
</script>
</body>
</html>
