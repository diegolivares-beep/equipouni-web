<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oportunidades del panel</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=Manrope:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body data-titulo="Oportunidades">

<a class="saltar" href="#contenido">Saltar al contenido</a>
<div id="cabecera"></div>

<main id="contenido" class="bloque">
  <div class="envoltura">
    <div class="encabezado-bloque">
      <h1 style="font-size:clamp(1.7rem,3vw,2.4rem)">Oportunidades</h1>
      <p><a class="boton" href="admin-oportunidad.html">Crear una oportunidad</a></p>
    </div>
    <div class="tabla-envoltura">
      <table class="tabla">
        <thead><tr>
          <th>Oportunidad</th><th>Estado interno</th><th>Cierre</th>
          <th class="num">Cupos</th><th class="num">Postulaciones</th><th></th>
        </tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
    <p class="pista" style="margin-top:1rem">El estado interno controla la visibilidad:
    borrador y vista previa no se publican; cerrada y cancelada se ven pero no reciben
    postulaciones.</p>
  </div>
</main>

<script src="config/marca.js"></script>
<script src="config/territorio.js"></script>
<script src="config/catalogo.js"></script>
<script src="config/estados.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modelo.js"></script>
<script src="assets/js/nucleo.js"></script>
<script src="assets/js/arranque.js"></script>
<script src="assets/js/clusters.js"></script>
<script src="assets/js/admin.js"></script>
<script>
EU.arranque.admin(function () { EU.admin.montar(); });
EU.alEstarListo(function () {
  'use strict';
  var esc = EU.util.esc;

  /* El panel ve TODAS las oportunidades, también borradores y canceladas.
     Orden: primero las que reciben postulaciones, luego por cierre. */
  var todas = EU.datos.oportunidades.slice().sort(function (a, b) {
    var ra = EU.estados.recibePostulaciones(a) ? 0 : 1;
    var rb = EU.estados.recibePostulaciones(b) ? 0 : 1;
    if (ra !== rb) return ra - rb;
    return String(a.cierrePostulacion).localeCompare(String(b.cierrePostulacion));
  });

  document.getElementById('filas').innerHTML = todas.map(function (o) {
    var posts = EU.datos.postulacionesA(o.id);
    var info = EU.estados.oportunidadInfo[o.estado];
    return '<tr>' +
      '<td><strong>' + esc(o.nombre) + '</strong>' +
        '<small>' + esc(o.organizacion) + ' · ' +
        esc(EU.territorio.nombreComuna(o.comuna)) + '</small></td>' +
      '<td>' + esc(info.etiqueta) +
        (EU.estados.recibePostulaciones(o) ? '<small>Recibiendo postulaciones</small>'
          : '<small>No recibe postulaciones</small>') + '</td>' +
      '<td>' + EU.util.dia(o.cierrePostulacion) + '</td>' +
      '<td class="num">' + o.cuposDisponibles + ' de ' + o.cupos + '</td>' +
      '<td class="num">' + posts.length + '</td>' +
      '<td><a href="admin-postulantes.html?id=' + encodeURIComponent(o.id) + '">Postulantes</a><br>' +
        '<a href="admin-oportunidad.html?id=' + encodeURIComponent(o.id) + '">Editar</a><br>' +
        '<button type="button" class="enlace-boton" data-enlace="' + esc(o.id) + '">Copiar enlace</button></td>' +
    '</tr>';
  }).join('');

  /* COPIAR ENLACE: existe sobre todo por las ocultas.
     "Oculta" significa que no se lista en el tablero, no que esté
     apagada: la página sigue respondiendo y quien tenga el enlace puede
     postular. El cliente la usa así a propósito, para repartirla por
     WhatsApp a quien él quiera. Hasta ahora no había forma de obtener ese
     enlace desde el panel y había que armarlo a mano. */
  document.getElementById('filas').addEventListener('click', function (e) {
    var b = e.target;
    if (!b.hasAttribute || !b.hasAttribute('data-enlace')) return;
    var url = location.origin + location.pathname.replace(/[^/]*$/, '') +
      'oportunidad.html?id=' + encodeURIComponent(b.getAttribute('data-enlace'));
    var texto = b.textContent;

    function listo(ok) {
      b.textContent = ok ? 'Enlace copiado' : url;
      if (!ok) {
        /* Sin portapapeles (http, o permiso denegado) se muestra el enlace
           para que se pueda copiar a mano, en vez de fallar en silencio. */
        b.style.userSelect = 'all';
        b.style.wordBreak = 'break-all';
        return;
      }
      setTimeout(function () { b.textContent = texto; }, 1800);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { listo(true); },
                                            function () { listo(false); });
    } else {
      listo(false);
    }
  });
});
</script>
</body>
</html>
