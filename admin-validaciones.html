<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validaciones</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=Manrope:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body data-titulo="Validaciones">

<a class="saltar" href="#contenido">Saltar al contenido</a>
<div id="cabecera"></div>

<main id="contenido" class="bloque">
  <div class="envoltura">
    <h1 style="font-size:clamp(1.7rem,3vw,2.4rem)">Validaciones de ficha</h1>
    <p class="angosto">Fichas esperando revisión humana. Se comprueba identidad,
    clasificación, fotografías, personalización y documentos. Aprobar habilita para
    postular; pedir corrección devuelve la ficha con la observación concreta.</p>
    <p id="mensaje" class="mensaje-form" role="status" aria-live="polite"></p>
    <div id="listado"></div>
  </div>
</main>

<script src="config/marca.js"></script>
<script src="config/territorio.js"></script>
<script src="config/catalogo.js"></script>
<script src="config/estados.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modelo.js"></script>
<script src="assets/js/nucleo.js"></script>
<script src="assets/js/arranque.js"></script>
<script src="assets/js/clusters.js"></script>
<script src="assets/js/admin.js"></script>
<script>
EU.arranque.admin(function () { EU.admin.montar(); });
EU.alEstarListo(function () {
  'use strict';
  var esc = EU.util.esc;
  var listado = document.getElementById('listado');
  var mensaje = document.getElementById('mensaje');

  function render() {
    var pendientes = EU.datos.emprendedores.filter(function (fi) {
      return fi.estado === 'pendiente' || fi.estado === 'correccion';
    });

    if (!pendientes.length) {
      listado.innerHTML = '<div class="sin-resultados"><h2>Nada pendiente</h2>' +
        '<p>Todas las fichas están resueltas.</p></div>';
      return;
    }

    listado.innerHTML = pendientes.map(function (fi) {
      var nombreSeccion = {};
      EU.admin.SECCIONES.forEach(function (s) { nombreSeccion[s[0]] = s[1]; });
      var obs = Object.keys(fi.observaciones || {}).map(function (s) {
        return '<p class="aviso-categoria"><strong>' +
          esc(nombreSeccion[s] || 'Observación') + ':</strong> ' +
          esc(fi.observaciones[s]) + '</p>';
      }).join('');
      var alerta = fi.clasificacion.rubro === EU.catalogo.OTRO
        ? '<p class="aviso-categoria">Está en "Otro": hay que decidir a qué ' +
          'rubro corresponde o si el catálogo necesita una categoría nueva.</p>'
        : '';

      /* Los dos selectores con los que se clasifica. El de subrubros es
         múltiple y se repuebla al elegir rubro; el marcado inicial es lo
         que ya tenga la ficha, para no perderlo al volver a validar. */
      var opcionesRubro = '<option value="">Elegir rubro…</option>' +
        EU.catalogo.rubros.map(function (ru) {
          var sel = ru.id === fi.clasificacion.rubro ? ' selected' : '';
          return '<option value="' + esc(ru.id) + '"' + sel + '>' + esc(ru.nombre) + '</option>';
        }).join('');

      var subsActuales = EU.catalogo.subrubrosDe(fi.clasificacion);
      var opcionesSub = EU.catalogo.subrubros(fi.clasificacion.rubro).map(function (s) {
        var sel = subsActuales.indexOf(s.id) !== -1 ? ' selected' : '';
        return '<option value="' + esc(s.id) + '"' + sel + '>' + esc(s.nombre) + '</option>';
      }).join('');

      var CAJA = 'padding:.55rem .6rem;border:1px solid var(--borde);' +
                 'border-radius:var(--r);font:inherit';

      var clasificar =
        '<div class="acciones-lote" style="align-items:flex-start;margin-bottom:.6rem">' +
          '<div style="min-width:190px">' +
            '<label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.2rem">Rubro</label>' +
            '<select data-rubro="' + esc(fi.id) + '" style="' + CAJA + ';width:100%">' +
              opcionesRubro +
            '</select>' +
          '</div>' +
          '<div style="min-width:190px">' +
            '<label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.2rem">Subrubros' +
              ' <span class="pista">Ctrl para varios</span></label>' +
            '<select data-sub="' + esc(fi.id) + '" multiple size="4" style="' + CAJA + ';width:100%">' +
              opcionesSub +
            '</select>' +
          '</div>' +
          '<div style="flex:1;min-width:200px">' +
            '<label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.2rem">Etiquetas' +
              ' <span class="pista">Separadas por coma</span></label>' +
            '<input type="text" data-etiq="' + esc(fi.id) + '" style="' + CAJA + ';width:100%"' +
              ' value="' + esc((fi.etiquetas || []).join(', ')) + '"' +
              ' placeholder="artesanía, reciclado, vegano">' +
          '</div>' +
        '</div>' +
        '<p class="pista" style="margin:0 0 .8rem">Si ningún rubro calza, agrégalo en ' +
          '<a href="admin-catalogo.html">Catálogo</a> y vuelve. Para validar hace falta ' +
          'rubro; las etiquetas y los subrubros son opcionales.</p>';

      return '<details class="postulacion">' +
        '<summary>' +
          '<span class="postulacion__resumen">' +
            '<strong>' + esc(fi.emprendimiento.nombre) + '</strong>' +
            '<small>' + esc(fi.representante.nombre) + ' · ' +
              esc(EU.admin.clasificacionCorta(fi)) + ' · enviada el ' +
              EU.util.dia(fi.actualizada) + '</small>' +
          '</span>' +
          '<span class="estado estado--' + (fi.estado === 'correccion' ? 'pronto' : 'cerrada') + '">' +
            esc(EU.estados.etiqueta('ficha', fi.estado)) + '</span>' +
        '</summary>' +
        '<div class="postulacion__detalle" style="max-width:none">' +
          alerta + obs +
          EU.admin.fichaCompleta(fi) +
          '<hr style="border:0;border-top:1px solid var(--borde);margin:1rem 0 .8rem">' +
          clasificar +
          '<div class="acciones-lote">' +
            '<button type="button" class="boton" data-validar="' + esc(fi.id) + '">Validar ficha</button>' +
            /* La observación se guarda contra una sección concreta, para
               que el emprendedor vea el problema donde tiene que
               arreglarlo y no bajo un título que dice "general". */
            '<select data-seccion="' + esc(fi.id) + '"' +
              ' style="padding:.55rem .6rem;border:1px solid var(--borde);border-radius:var(--r);font:inherit">' +
              EU.admin.SECCIONES.map(function (s) {
                return '<option value="' + esc(s[0]) + '">' + esc(s[1]) + '</option>';
              }).join('') +
            '</select>' +
            '<input type="text" data-obs="' + esc(fi.id) + '" placeholder="Qué tiene que corregir"' +
              ' style="flex:1;min-width:200px;padding:.55rem .6rem;border:1px solid var(--borde);border-radius:var(--r);font:inherit">' +
            '<button type="button" class="boton boton--linea" data-corregir="' + esc(fi.id) + '">Pedir corrección</button>' +
          '</div>' +
        '</div>' +
      '</details>';
    }).join('');
  }

  /* Los subrubros dependen del rubro, así que se repueblan al cambiarlo.
     Se escucha en el contenedor y no en cada selector, para que valga
     también para los que se dibujen después de resolver una ficha. */
  listado.addEventListener('change', function (e) {
    var sel = e.target;
    if (!sel.hasAttribute || !sel.hasAttribute('data-rubro')) return;
    var id = sel.getAttribute('data-rubro');
    var destino = document.querySelector('[data-sub="' + id + '"]');
    if (!destino) return;
    destino.innerHTML = EU.catalogo.subrubros(sel.value).map(function (s) {
      return '<option value="' + esc(s.id) + '">' + esc(s.nombre) + '</option>';
    }).join('');
  });

  /* Lo que el revisor dejó escrito en los tres controles de esa ficha. */
  function clasificacionDe(id) {
    var selRubro = document.querySelector('[data-rubro="' + id + '"]');
    var selSub = document.querySelector('[data-sub="' + id + '"]');
    var campoEtiq = document.querySelector('[data-etiq="' + id + '"]');
    return {
      rubro: selRubro ? selRubro.value : '',
      subrubros: selSub
        ? Array.prototype.map.call(selSub.selectedOptions, function (o) { return o.value; })
        : [],
      etiquetas: EU.admin.etiquetasDesdeTexto(campoEtiq ? campoEtiq.value : '')
    };
  }

  listado.addEventListener('click', function (e) {
    var b = e.target;
    if (b.hasAttribute('data-validar')) {
      var id = b.getAttribute('data-validar');
      var clas = clasificacionDe(id);
      /* Validar sin rubro deja a la persona habilitada para postular y
         fuera de todos los filtros: quedaría esperando algo que nunca la
         va a encontrar. Por eso el rubro es obligatorio acá y no un
         "ya lo pongo después". */
      if (!clas.rubro) {
        mensaje.className = 'mensaje-form mensaje-form--error';
        mensaje.textContent = 'Elige el rubro antes de validar: sin rubro la ficha no ' +
          'aparece en ninguna búsqueda de oportunidad.';
        var foco = document.querySelector('[data-rubro="' + id + '"]');
        if (foco) foco.focus();
        return;
      }
      b.disabled = true;
      EU.admin.resolverFicha(id, 'validar', '', '', clas).then(function () {
        mensaje.className = 'mensaje-form';
        mensaje.textContent = 'Ficha validada y clasificada. El correo al emprendedor ' +
          'sale solo; en Comunicaciones se puede cambiar el texto.';
        render();
      }).catch(function (err) {
        b.disabled = false;
        mensaje.className = 'mensaje-form mensaje-form--error';
        mensaje.textContent = err.message;
      });
    } else if (b.hasAttribute('data-corregir')) {
      var id2 = b.getAttribute('data-corregir');
      var campo = document.querySelector('[data-obs="' + id2 + '"]');
      if (!campo.value.trim()) {
        mensaje.textContent = 'Escribe la observación: el emprendedor necesita saber qué corregir.';
        mensaje.className = 'mensaje-form mensaje-form--error';
        campo.focus();
        return;
      }
      var selector = document.querySelector('[data-seccion="' + id2 + '"]');
      b.disabled = true;
      /* Al pedir corrección la clasificación se guarda igual si ya la
         escribió: así no se pierde el trabajo de clasificar cuando la
         ficha va y vuelve varias veces. */
      EU.admin.resolverFicha(id2, 'corregir', campo.value.trim(),
                             selector ? selector.value : 'general',
                             clasificacionDe(id2)).then(function () {
        mensaje.className = 'mensaje-form';
        mensaje.textContent = 'Ficha devuelta a corrección. El correo con la observación ' +
          'sale solo.';
        render();
      }).catch(function (err) {
        b.disabled = false;
        mensaje.className = 'mensaje-form mensaje-form--error';
        mensaje.textContent = err.message;
      });
    }
  });

  EU.admin.conectarDocumentos(listado);
  render();
});
</script>
</body>
</html>
