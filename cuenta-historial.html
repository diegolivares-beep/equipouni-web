<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Manrope:wght@400..700&display=swap">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body data-titulo="Historial">

<a class="saltar" href="#contenido">Saltar al contenido</a>
<div id="cabecera"></div>

<main id="contenido" class="bloque">
  <div class="envoltura">
    <h1>Historial</h1>
    <p class="angosto">Postulaciones cerradas y participaciones que ya ocurrieron.
    Sirven de respaldo: acá queda constancia de en qué participaste y cómo terminó
    cada proceso.</p>
    <div id="listado"></div>
  </div>
</main>

<div id="pie"></div>

<script src="config/marca.js"></script>
<script src="config/territorio.js"></script>
<script src="config/catalogo.js"></script>
<script src="config/estados.js"></script>
<script src="data/oportunidades.js"></script>
<script src="data/emprendedores.js"></script>
<script src="data/postulaciones.js"></script>
<script src="assets/js/nucleo.js"></script>
<script src="assets/js/cuenta.js"></script>
<script>
EU.cuenta.montar();
(function () {
  var historicas = EU.datos.postulacionesDe(EU.sesion.emprendedor).filter(EU.cuenta.esHistorica);
  document.getElementById('listado').innerHTML = historicas.length
    ? historicas.map(EU.cuenta.filaPostulacion).join('')
    : '<div class="sin-resultados"><h2>Todavía no hay nada en el historial</h2>' +
      '<p>Cuando pase tu primer evento, va a quedar registrado acá.</p></div>';
})();
</script>
</body>
</html>
