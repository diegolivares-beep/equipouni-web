# Sitio de EquipoUni.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las imágenes y fuentes llevan mucho tiempo sin cambiar.
    location ~* \.(jpg|jpeg|png|webp|svg|woff2|ico)$ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # El HTML y el código se revisan siempre, para que los cambios se
    # vean al recargar y nadie quede con una versión vieja.
    location ~* \.(html|js|css)$ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        include /etc/nginx/seguridad.conf;
        try_files $uri $uri/ =404;
    }
}
