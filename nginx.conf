# Configuración del sitio de EquipoUni.
# Además de servir los archivos, aplica las cabeceras de seguridad
# estándar: sin ellas el navegador no protege contra varios ataques
# comunes aunque el código esté bien.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El navegador solo puede cargar recursos desde donde decimos.
    # Corta de raíz la inyección de scripts de terceros.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://api.equipouni.cl; connect-src 'self' https://api.equipouni.cl; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Nadie puede meter el sitio dentro de un iframe para engañar a la
    # gente haciéndole tocar botones que no ve.
    add_header X-Frame-Options "DENY" always;

    # El navegador respeta el tipo de archivo declarado y no adivina.
    add_header X-Content-Type-Options "nosniff" always;

    # Al salir del sitio no se filtra la dirección completa que se visitaba.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nada de cámara, micrófono ni ubicación: esta plataforma no los usa.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Una vez que alguien entra por HTTPS, su navegador no vuelve a
    # intentar por HTTP durante un año.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Los archivos con nombre versionado se pueden guardar mucho tiempo;
    # el HTML no, para que los cambios se vean al recargar.
    location ~* \.(jpg|jpeg|png|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
