<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oportunidades abiertas</title>
<meta name="description" content="Todas las ferias, mercados, pop-ups y convocatorias con postulación abierta: comuna, fechas, cupos, costo y plazo, filtrables por tipo, rubro y mes.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body data-titulo="Oportunidades abiertas">

<a class="saltar" href="#contenido">Saltar al contenido</a>
<div id="cabecera"></div>

<main id="contenido">

  <section class="filtros" aria-labelledby="t-filtros">
    <div class="envoltura">
      <h2 id="t-filtros" class="oculto-visual">Filtrar oportunidades</h2>
      <form id="filtros">
        <div>
          <label for="f-tipo">Tipo</label>
          <select id="f-tipo" name="tipo"><option value="">Todos</option></select>
        </div>
        <!-- El selector de región solo se muestra cuando hay más de una
             región habilitada. Ver config/territorio.js. -->
        <div id="campo-region">
          <label for="f-region">Región</label>
          <select id="f-region" name="region"><option value="">Todas</option></select>
        </div>
        <div>
          <label for="f-comuna">Comuna</label>
          <select id="f-comuna" name="comuna"><option value="">Todas</option></select>
        </div>
        <div>
          <label for="f-rubro">Rubro</label>
          <select id="f-rubro" name="rubro"><option value="">Todos</option></select>
        </div>
        <div>
          <label for="f-mes">Mes del evento</label>
          <select id="f-mes" name="mes"><option value="">Cualquiera</option></select>
        </div>
        <div>
          <label class="casilla" style="margin-bottom:.4rem">
            <input type="checkbox" name="gratuitas">
            <span>Solo gratuitas</span>
          </label>
          <label class="casilla" style="margin:0">
            <input type="checkbox" name="cerradas">
            <span>Incluir cerradas</span>
          </label>
        </div>
      </form>
    </div>
  </section>

  <section class="bloque">
    <div class="envoltura">
      <div class="encabezado-bloque">
        <h1 style="font-size:clamp(1.8rem,3.4vw,2.6rem)">Oportunidades</h1>
        <p id="resumen-filtros" class="resumen-filtros" role="status" aria-live="polite"></p>
      </div>
      <ul class="oportunidades" id="oportunidades-listado"></ul>
    </div>
  </section>

</main>

<div id="pie"></div>

<script src="config/marca.js"></script>
<script src="config/territorio.js"></script>
<script src="config/catalogo.js"></script>
<script src="config/estados.js"></script>
<script src="data/oportunidades.js"></script>
<script src="assets/js/nucleo.js"></script>
<script>EU.ui.montarEsqueleto();</script>
<script src="assets/js/tablero.js"></script>
</body>
</html>
