# Cabeceras de seguridad. Van en un archivo aparte porque nginx tiene una
# trampa: si un bloque "location" declara su propio add_header, descarta
# TODOS los del nivel de arriba. Por eso este archivo se incluye dentro
# de cada location en vez de declararlos una sola vez.

# El navegador solo carga recursos desde donde decimos: corta de raíz la
# inyección de scripts de terceros.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://api.equipouni.cl; connect-src 'self' https://api.equipouni.cl; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

# Nadie puede meter el sitio en un iframe para que alguien toque botones
# que no ve.
add_header X-Frame-Options "DENY" always;

# El navegador respeta el tipo de archivo declarado y no lo adivina.
add_header X-Content-Type-Options "nosniff" always;

# Al salir del sitio no se filtra la dirección completa que se visitaba.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Esta plataforma no usa cámara, micrófono ni ubicación.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Quien entró una vez por HTTPS no vuelve a intentar por HTTP en un año.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
